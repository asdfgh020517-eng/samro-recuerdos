<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña - SamRO</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        body {
            background-color: #ffe6ed;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card-login {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 360px;
            text-align: center;
        }

        .card-login h2 {
            color: #d81b60;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .btn-enviar {
            width: 100%;
            background-color: #e91e63;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-enviar:hover {
            background-color: #c2185b;
        }

        .mensaje-error {
            color: #ef5350;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .link-volver {
            display: inline-block;
            margin-top: 15px;
            color: #1e88e5;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="card-login">
        <h2>🔐 Cambiar Contraseña</h2>

        <script>
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('error')) {
                document.write('<p class="mensaje-error">❌ Usuario o contraseña actual incorrectos.</p>');
            }
        </script>

        <form action="/cambiar-password" method="POST">
            <div class="form-group">
                <label>Usuario:</label>
                <input type="text" name="usuario" required placeholder="admin o amor">
            </div>

            <div class="form-group">
                <label>Contraseña Actual:</label>
                <input type="password" name="password_actual" required>
            </div>

            <div class="form-group">
                <label>Nueva Contraseña:</label>
                <input type="password" name="nueva_password" required>
            </div>

            <button type="submit" class="btn-enviar">Guardar Nueva Contraseña 🔑</button>
        </form>

        <a href="/login" class="link-volver">⬅️ Volver al Inicio de Sesión</a>
    </div>

</body>
</html>
